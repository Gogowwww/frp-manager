# Seul script Python du dépôt : la passerelle qui fait passer les installations
# Python au programme Go (packaging/python-bridge). Le panel et le site sont en
# Go (go test ./...).

# Linter des scripts (lancé par la CI) : erreurs réelles d'abord, pas le style.
[tool.ruff]
target-version = "py38"
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "S102", "S307", "S506", "S602", "S604", "S605", "S608"]
ignore = ["E401", "E701", "E702", "E731"]

[tool.ruff.lint.per-file-ignores]
"packaging/python-bridge/*" = ["S603", "S607"]
