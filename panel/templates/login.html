<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="csrf-token" content="{{ csrf_token() }}">
<title>Connexion — FRP Manager</title>
<script nonce="{{ csp_nonce() }}">
  try { var th = localStorage.getItem('frpm.theme'); if (th === 'light' || th === 'dark') document.documentElement.dataset.theme = th; } catch (e) {}
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- Polices chargées sans bloquer l'affichage : sans accès à Google, la page
     s'affiche tout de suite avec les polices du système. -->
<link rel="stylesheet" id="fonts" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" media="print">
<script nonce="{{ csp_nonce() }}">document.getElementById('fonts').addEventListener('load', function () { this.media = 'all'; });</script>
<link rel="stylesheet" href="{{ asset('css/app.css') }}">
<link rel="modulepreload" href="{{ asset('js/i18n.js') }}">
<link rel="modulepreload" href="{{ asset('locales/fr.js') }}">
</head>
<body>
{% include "partials/icons.html" %}

<main class="auth" data-oidc-error="{{ oidc_error }}">
  <div class="auth-card">
    <div class="auth-brand">
      <svg class="brand-logo" viewBox="0 0 26 26" fill="none" aria-hidden="true"><use href="#i-logo"/></svg>
      <div>
        <h1 class="auth-title" data-i18n="login.title">Connexion à FRP Manager</h1>
        <p class="auth-sub" data-i18n="login.subtitle"></p>
      </div>
    </div>
    <form class="card auth-form" id="login-form" novalidate>
      <div class="field">
        <label class="field-label" for="username" data-i18n="login.username"></label>
        <input class="input" id="username" name="username" autocomplete="username" autocapitalize="off" spellcheck="false" required autofocus>
      </div>
      <div class="field">
        <label class="field-label" for="password" data-i18n="login.password"></label>
        <input class="input" id="password" name="password" type="password" autocomplete="current-password" required>
      </div>
      <p class="auth-error" id="login-error" role="alert"></p>
      <button class="btn btn-primary btn-block" type="submit" id="login-submit" data-i18n="login.submit"></button>
    </form>
    <div class="auth-sso">
      <div class="auth-sep" role="presentation"><span data-i18n="login.or"></span></div>
      {% if passkeys %}
      <button class="btn btn-secondary btn-block" type="button" id="login-passkey">
        <svg class="icon"><use href="#i-key"/></svg><span data-i18n="login.passkey"></span>
      </button>
      {% endif %}
      {% if oidc_enabled %}
      <a class="btn btn-secondary btn-block" href="/auth/oidc/login" id="login-sso">
        <svg class="icon"><use href="#i-shield"/></svg><span id="login-sso-label" data-label="{{ oidc_label }}"></span>
      </a>
      {% endif %}
    </div>
  </div>
</main>

<script type="module" nonce="{{ csp_nonce() }}">
  import { initI18n, applyI18n, t, getLocale } from "{{ asset('js/i18n.js') }}";
  import { csrfToken } from "{{ asset('js/api.js') }}";
  import { passkeysUnavailable, passkeyAutofill, getPasskey } from "{{ asset('js/passkey.js') }}";

  await initI18n();
  applyI18n();
  document.title = `${t('login.docTitle')} — FRP Manager`;

  // Connexion unique : libellé choisi par l'administrateur, erreur au retour du fournisseur
  const sso = document.getElementById('login-sso-label');
  if (sso) sso.textContent = t('login.sso', { name: sso.dataset.label });
  const oidcError = document.querySelector('main.auth').dataset.oidcError;
  if (oidcError) document.getElementById('login-error').textContent = t(`login.oidcError.${oidcError}`);

  const form = document.getElementById('login-form');
  const error = document.getElementById('login-error');
  const submit = document.getElementById('login-submit');

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const username = form.username.value.trim();
    const password = form.password.value;
    if (!username || !password) { error.textContent = t('login.missing'); return; }
    error.textContent = '';
    submit.setAttribute('aria-busy', 'true');
    submit.disabled = true;
    try {
      const r = await fetch('/api/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'X-CSRF-Token': csrfToken(), 'X-Lang': getLocale() },
        body: JSON.stringify({ username, password }),
      });
      const d = await r.json();
      if (d.ok) { location.href = '/'; return; }
      error.textContent = d.msg || t('login.failed');
      form.password.select();
    } catch {
      error.textContent = t('errors.network');
    }
    submit.removeAttribute('aria-busy');
    submit.disabled = false;
  });

  // ── Passkeys : bouton, et suggestion dans le champ identifiant ─────────────
  const post = async (path, body) => {
    const r = await fetch(path, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'X-CSRF-Token': csrfToken(), 'X-Lang': getLocale() },
      body: JSON.stringify(body || {}),
    });
    return r.json();
  };
  const pkButton = document.getElementById('login-passkey');
  if (pkButton && passkeysUnavailable()) pkButton.hidden = true;
  if (pkButton && !pkButton.hidden) {
    let autofill = null; // { ctrl, ready } : demande en attente dans le champ identifiant

    // Un seul défi à la fois dans la session : le bouton attend que la demande
    // de la suggestion ait reçu le sien, puis l'annule.
    const finish = async (cred) => {
      const d = await post('/api/login/passkey', { credential: cred });
      if (d.ok) { location.href = '/'; return true; }
      error.textContent = d.msg || t('login.passkeyFailed');
      return false;
    };
    const startAutofill = async () => {
      if (!(await passkeyAutofill())) return;
      const ctrl = new AbortController();
      const ready = post('/api/login/passkey/options').catch(() => null);
      autofill = { ctrl, ready };
      const d = await ready;
      if (!d?.ok || ctrl.signal.aborted) return;
      try {
        const cred = await getPasskey(d.publicKey, { signal: ctrl.signal, mediation: 'conditional' });
        if (cred && !(await finish(cred))) startAutofill();
      } catch { /* annulée, ou remplacée par le bouton */ }
    };

    pkButton.addEventListener('click', async () => {
      error.textContent = '';
      pkButton.disabled = true;
      pkButton.setAttribute('aria-busy', 'true');
      try {
        if (autofill) { await autofill.ready; autofill.ctrl.abort(); autofill = null; }
        const d = await post('/api/login/passkey/options');
        if (!d.ok) { error.textContent = d.msg || t('login.passkeyFailed'); return; }
        const cred = await getPasskey(d.publicKey);
        if (cred && (await finish(cred))) return;
      } catch (err) {
        error.textContent = err?.name === 'NotAllowedError' ? t('login.passkeyCancelled')
          : err?.name === 'SecurityError' ? t('login.passkeyRefused')
          : err?.name === 'TypeError' ? t('errors.network') : t('login.passkeyFailed');
      } finally {
        pkButton.disabled = false;
        pkButton.removeAttribute('aria-busy');
      }
      startAutofill();
    });

    form.username.setAttribute('autocomplete', 'username webauthn');
    startAutofill();
  }
</script>
</body>
</html>
