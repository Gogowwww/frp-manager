# Mode autonome : frps et frpc font partie de l'image et sont lancés par le
# panel, dans le conteneur. Pas de privileged, pas de pid: host, pas de socket
# Docker : tout ce qui doit durer est dans le volume /data. Pour piloter plutôt
# le frp installé sur l'hôte (systemd) :
# packaging/docker/docker-compose.host.yml.
# Standalone mode: frps and frpc are part of the image and run by the panel,
# inside the container. No privileged, no pid: host, no Docker socket:
# everything that must last is in the /data volume. To drive the frp installed
# on the host instead (systemd): packaging/docker/docker-compose.host.yml.
#
#   docker compose up -d

services:
  frp-manager:
    # Prebuilt image on GitHub Container Registry
    image: ghcr.io/gogowwww/frp-manager:latest
    # To build from source: comment out the image line and uncomment build
    # build: .
    container_name: frp-manager
    restart: unless-stopped

    # Réseau de l'hôte : frps écoute directement sur les ports de la machine
    # (les remotePort des tunnels n'ont pas à être publiés un par un), et le
    # pare-feu du panel filtre le trafic de la machine.
    # Host network: frps listens directly on the machine's ports (the tunnels'
    # remotePort do not have to be published one by one), and the panel's
    # firewall filters the machine's traffic.
    network_mode: host

    # Pare-feu du panel (nftables) : la seule capacité ajoutée. Sans elle, tout
    # le reste fonctionne et la page Pare-feu explique ce qui manque.
    # Panel firewall (nftables): the only added capability. Without it,
    # everything else works and the Firewall page explains what is missing.
    cap_add:
      - NET_ADMIN

    volumes:
      # Tout ce qui doit durer : config du panel et certificats (panel/),
      # configs frps/frpc (frp/), logs (log/), état et frp mis à jour depuis le
      # panel (lib/). Pour un dossier de l'hôte : - ./frp-manager-data:/data
      # Everything that must last: panel config and certificates (panel/),
      # frps/frpc configs (frp/), logs (log/), state and frp updated from the
      # panel (lib/). For a host folder: - ./frp-manager-data:/data
      - frp-manager-data:/data

    environment:
      - FRP_MANAGER_PORT=8765
      # New install: the panel only listens on 127.0.0.1 (reach it through an
      # SSH tunnel or a local reverse proxy). To open it to your local
      # network, uncomment the next line, create the account right away and
      # filter access (firewall, VPN):
      # - FRP_MANAGER_HOST=0.0.0.0
      # Port d'écoute du frps créé au premier lancement (par défaut : tiré au
      # hasard entre 10000 et 32767, affiché dans le panel)
      # Listening port of the frps created on first launch (default: picked at
      # random between 10000 and 32767, shown in the panel)
      # - FRPS_BIND_PORT=7000
      # Disable third-party download mirrors (ghproxy, ghfast, gh-proxy):
      # - FRP_MANAGER_NO_MIRRORS=1

    # Sans réseau de l'hôte (réseau Docker par défaut) : retirez network_mode,
    # publiez le panel, le port de frps et ceux des tunnels, et mettez
    # FRP_MANAGER_HOST=0.0.0.0 (le panel est alors joint par Docker) :
    # Without the host network (default Docker network): remove network_mode,
    # publish the panel, frps's port and the tunnels' ports, and set
    # FRP_MANAGER_HOST=0.0.0.0 (the panel is then reached through Docker):
    # ports:
    #   - "127.0.0.1:8765:8765"
    #   - "7000:7000"
    #   - "30000-30010:30000-30010"

volumes:
  frp-manager-data:
