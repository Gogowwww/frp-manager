# Stack pour Portainer (Stacks → Add stack → Web editor), ou « docker compose up -d ».
# Stack for Portainer (Stacks → Add stack → Web editor), or "docker compose up -d".
#
# Variables à renseigner dans Portainer (Environment variables) :
#   STATS_TOKEN  jeton de lecture de /stats.json (laisser vide : la route n'existe pas)
#   TRUST_PROXY  1 si un proxy de confiance (Caddy, Nginx Proxy Manager, Cloudflare,
#                Traefik…) est devant ; sinon 0, sans quoi la limite par adresse
#                verrait l'adresse du proxy
# Variables to set in Portainer (Environment variables):
#   STATS_TOKEN  read token for /stats.json (leave empty: the route does not exist)
#   TRUST_PROXY  1 if a trusted proxy (Caddy, Nginx Proxy Manager, Cloudflare,
#                Traefik…) is in front; otherwise 0, or the per-address limit would
#                see the proxy's address
#
# Le proxy envoie vers le port 8080 du conteneur et ajoute le HTTPS ; les noms
# d'hôte à lui donner sont api.frp-manager.org et frp-manager.gogow.fr.
# The proxy forwards to the container's port 8080 and adds HTTPS; the host names to
# give it are api.frp-manager.org and frp-manager.gogow.fr.

services:
  statsd:
    image: ghcr.io/gogowwww/frp-manager-statsd:latest
    restart: unless-stopped
    environment:
      STATS_TOKEN: ${STATS_TOKEN:-}
      TRUST_PROXY: ${TRUST_PROXY:-0}
    volumes:
      - statsd-data:/data
    ports:
      - "8081:8080"
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true

volumes:
  statsd-data:
