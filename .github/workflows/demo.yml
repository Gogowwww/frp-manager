# GitHub Actions : site de FRP Manager (https://frp-manager.gogow.fr) —
# page d'accueil, documentation et démo en ligne (interface réelle, données fictives).
# GitHub Actions: FRP Manager website (https://frp-manager.gogow.fr) — home
# page, documentation and online demo (real interface, fake data).
#
# Le générateur du site vit dans le dépôt privé administrator/frp-manager-demo
# du Forgejo (dossier website/, module Go à part) ; le cloudpod Go de
# Webstrator y clone le site publié. À chaque push sur main qui touche
# l'interface ou la documentation, ce workflow construit le site et le publie
# à la racine de frp-manager-demo (site/ et un module Go autonome qui le sert).
# The site generator lives in the private repository
# administrator/frp-manager-demo on Forgejo (website/ folder, separate Go
# module); the Webstrator Go cloudpod clones the published site from there. On
# every push to main that touches the interface or the documentation, this
# workflow builds the site and publishes it at the root of frp-manager-demo
# (site/ and a standalone Go module that serves it).
#
# Après un changement du site lui-même (frp-manager-demo/website), lancer ce
# workflow à la main : Actions → « Site et démo » → Run workflow.
# After a change to the site itself (frp-manager-demo/website), run this
# workflow by hand: Actions → "Site et démo" → Run workflow.
#
# Prérequis : secret DEMO_REPO_TOKEN, jeton Forgejo avec le droit d'écriture
# sur frp-manager-demo.
# Requirements: secret DEMO_REPO_TOKEN, Forgejo token with write access to
# frp-manager-demo.

name: Site et démo

on:
  push:
    branches: [main]
    paths: ['panel/templates/**', 'docs/**', '*.md', '.github/workflows/demo.yml']
  workflow_dispatch:

permissions: {}

env:
  FORGEJO_URL: https://forgejo.gogow.fr
  DEMO_REPO: administrator/frp-manager-demo

jobs:
  publish:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      # Historique complet : les dates « lastmod » du sitemap viennent de git log
      # Full history: the sitemap "lastmod" dates come from git log
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: src
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26" # dernier correctif 1.26.x / latest 1.26.x patch
          check-latest: true
      - name: Construire et publier le site
        env:
          DEMO_REPO_TOKEN: ${{ secrets.DEMO_REPO_TOKEN }}
        run: |
          set -eu
          # Espaces et retours à la ligne collés avec la valeur du secret : retirés
          DEMO_REPO_TOKEN=$(printf '%s' "$DEMO_REPO_TOKEN" | tr -d '[:space:]')
          [ -n "$DEMO_REPO_TOKEN" ] || { echo "Secret DEMO_REPO_TOKEN manquant"; exit 1; }
          AUTH="Authorization: token $DEMO_REPO_TOKEN"
          URL="$FORGEJO_URL/$DEMO_REPO.git"
          # Historique sans le contenu des anciennes versions (--filter) : dates du
          # sitemap pour les pages du site, sans retélécharger chaque site publié
          git -c "http.extraHeader=$AUTH" clone --quiet --filter=blob:none "$URL" out \
            || { echo "DEMO_REPO_TOKEN refusé ou sans accès à $DEMO_REPO ($URL)"; exit 1; }
          [ -f out/website/content.json ] || { echo "$DEMO_REPO : dossier website/ absent"; exit 1; }
          git -C out log -1 --format='Site : %h %s' -- website

          # Numéro affiché : dernière version publiée
          VERSION=$(git -C src tag --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -1 || true)
          SHA=$(git -C src rev-parse --short HEAD)
          export FRP_MANAGER_REPO="$PWD/src"
          cd out/website
          go test -count=1 .
          go run . build --out ../../dist-site --version "${VERSION:-dev}" --bundle ..
          # Audit SEO : un titre en double, un lien cassé ou un JSON-LD invalide bloque la publication
          go run . seo ../../dist-site
          cd ..

          git add -A
          if git diff --cached --quiet; then
            echo "Site inchangé, rien à publier"
            exit 0
          fi
          git -c user.name="FRP Manager (démo)" -c user.email="demo@frp-manager.invalid" \
            commit --quiet -m "Site ${VERSION:-dev} (frp-manager $SHA)"
          git -c "http.extraHeader=$AUTH" push --quiet "$URL" HEAD:main
          echo "Publié : $DEMO_REPO ($(git rev-parse --short HEAD))"
