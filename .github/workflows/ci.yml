# GitHub Actions : intégration continue du panel Go, à chaque push sur main et
# sur les pull requests : tests Go (go vet, go test, gofmt), programme des trois
# architectures, archive frp-manager.zip et paquets .deb, outils et scripts.
# GitHub Actions: continuous integration of the Go panel, on every push to main
# and on pull requests: Go tests (go vet, go test, gofmt), program for the
# three architectures, frp-manager.zip archive and .deb packages, tools and
# scripts.
#
# Sur main seulement : les paquets partent dans le canal « dev » du dépôt APT
# (apt.frp-manager.org, servi par Cloudflare Pages), puis s'installent par apt
# dans des conteneurs Debian 12 et Ubuntu 24.04 neufs.
# On main only: the packages go to the "dev" channel of the APT repository
# (apt.frp-manager.org, served by Cloudflare Pages), then are installed with apt
# in fresh Debian 12 and Ubuntu 24.04 containers.
#
# Prérequis : secrets APT_GPG_KEY, CLOUDFLARE_API_TOKEN et CLOUDFLARE_ACCOUNT_ID.
# Requirements: secrets APT_GPG_KEY, CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID.

name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions: {}


jobs:
  go:
    runs-on: ubuntu-24.04
    outputs:
      deb_version: ${{ steps.build.outputs.deb_version }}
    # Un seul publieur à la fois sur le dépôt APT / One publisher at a time on the APT repository
    concurrency:
      group: apt-pages
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      # Actions épinglées par SHA (contrôle de Plumber) / Actions pinned by SHA (Plumber check)
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # les tags : version du paquet dev (git describe) / tags: dev package version (git describe)
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: go vet, go test, gofmt
        run: docker buildx build --target test --progress plain .
      - name: Programme (trois architectures) et paquets .deb
        id: build
        run: |
          set -eu
          SHORT=$(git rev-parse --short=7 HEAD)
          BASE=$(git describe --tags --abbrev=0 --match 'v[0-9]*' 2>/dev/null | sed 's/^v//' || true)
          PANEL_VERSION="dev-$SHORT"
          DEB_VERSION="${BASE:-0.0.0}+dev.${{ github.run_number }}.g$SHORT"
          echo "deb_version=$DEB_VERSION" >> "$GITHUB_OUTPUT"
          docker buildx build --target binaries --build-arg PANEL_VERSION="$PANEL_VERSION" \
            --output type=local,dest=ci/bin .
          ls -l ci/bin
          sh -n packaging/deb/postinst && sh -n packaging/deb/prerm && sh -n packaging/deb/postrm
          mkdir -p ci/frp-manager/bin
          cp ci/bin/frp-manager-linux-* ci/frp-manager/bin/
          cp panel/install.sh ci/frp-manager/
          sed "s/__VERSION__/$PANEL_VERSION/" packaging/python-bridge/app.py > ci/frp-manager/app.py
          (cd ci && zip -qr frp-manager.zip frp-manager && ls -l frp-manager.zip)
          sh packaging/deb/build-deb.sh "$DEB_VERSION" ci/bin ci/deb
          for f in ci/deb/*.deb; do
            dpkg-deb --field "$f" Package Version Architecture | tr '\n' ' '; echo
          done
      # wrangler (envoi vers Cloudflare Pages) demande Node.js 22 ou plus
      # wrangler (upload to Cloudflare Pages) needs Node.js 22 or later
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        with:
          node-version: 22
      - name: Dépôt APT sur Cloudflare Pages (dev)
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        env:
          APT_GPG_KEY: ${{ secrets.APT_GPG_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          [ -n "$APT_GPG_KEY" ] && [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ] || { echo "Clé APT ou secrets Cloudflare absents : dépôt Pages ignoré"; exit 0; }
          sh packaging/deb/publish-pages.sh dev ci/deb/*.deb

  # Le reste du dépôt (le panel et ses sous-paquets, dont panel/netaddr, sont
  # testés par le job go, dans l'image) : outils (robot des listes, notes de
  # release), vulnérabilités connues des dépendances, syntaxe des scripts shell
  # et de la passerelle Python.
  # The rest of the repository (the panel and its sub-packages, panel/netaddr
  # included, are tested by the go job, in the image): tools (lists bot, release
  # notes), known vulnerabilities of dependencies, syntax of the shell scripts
  # and of the Python bridge.
  outils:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26" # dernier correctif 1.26.x / latest 1.26.x patch
          check-latest: true
      - name: Vérifications
        run: |
          set -eu
          git config --global user.name ci
          git config --global user.email ci@frp-manager.invalid
          test -z "$(gofmt -l .)" || { echo "gofmt :"; gofmt -l .; exit 1; }
          go vet ./...
          go test -count=1 ./tools/...
          go run golang.org/x/vuln/cmd/govulncheck@latest ./...
          bash -n panel/install.sh
          for f in packaging/deb/postinst packaging/deb/prerm packaging/deb/postrm packaging/deb/build-deb.sh packaging/deb/publish-pages.sh; do
            sh -n "$f"
          done
          python3 -m py_compile packaging/python-bridge/app.py

  # Installation par apt depuis apt.frp-manager.org (Cloudflare Pages), comme sur
  # une vraie machine : clé, source, paquet, panel qui répond, puis désinstallation
  # complète. Pages sert le nouveau déploiement dès la fin de l'envoi
  # (publish-pages.sh le vérifie) ; on attend tout de même la version exacte du job
  # go, au cas où un cache se trouverait entre les deux.
  # Installation with apt from apt.frp-manager.org (Cloudflare Pages), like on a
  # real machine: key, source, package, panel answering, then complete uninstall.
  # Pages serves the new deployment as soon as the upload ends (publish-pages.sh
  # checks it); we still wait for the exact version of the go job, in case a cache
  # sits in between.
  apt:
    needs: go
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-24.04
    permissions: {}
    strategy:
      fail-fast: false
      matrix:
        # Images épinglées par empreinte (contrôle de Plumber) / Images pinned by digest (Plumber check)
        image:
          - debian:12@sha256:854dd8ab51d62866dbd8f5431d15ce77b12983a2a4a1e1fe43a2395dc7ef9f61
          - ubuntu:24.04@sha256:68ee22004a9109b44973313b02ff7b1de250f1de0f5ecb628d73f579aaff33ac
    container:
      image: ${{ matrix.image }}
    env:
      APT_URL: https://apt.frp-manager.org
      DEB_VERSION: ${{ needs.go.outputs.deb_version }}
    steps:
      - name: apt install frp-manager (canal dev)
        run: |
          set -eu
          export DEBIAN_FRONTEND=noninteractive
          apt-get update -qq
          apt-get install -y -qq curl ca-certificates iproute2 procps >/dev/null
          install -d -m 0755 /etc/apt/keyrings
          curl -fsSL "$APT_URL/repository.key" -o /etc/apt/keyrings/frp-manager.asc
          echo "deb [signed-by=/etc/apt/keyrings/frp-manager.asc] $APT_URL dev main" > /etc/apt/sources.list.d/frp-manager.list
          # Attendre que apt.frp-manager.org serve la version qui vient d'être publiée
          # (2 minutes au plus : Pages la sert normalement au premier essai)
          # Wait for apt.frp-manager.org to serve the version that was just published
          # (2 minutes at most: Pages normally serves it on the first try)
          found=""
          for i in $(seq 1 12); do
            apt-get update -qq || true
            if apt-cache madison frp-manager | grep -qF "$DEB_VERSION"; then found=1; break; fi
            echo "version $DEB_VERSION pas encore servie (essai $i)"; sleep 10
          done
          apt-cache policy frp-manager
          [ -n "$found" ] || { echo "version $DEB_VERSION jamais servie par $APT_URL"; exit 1; }
          apt-get install -y "frp-manager=$DEB_VERSION"
          frp-manager --version
          [ "$(dpkg-query -W -f='${Version}' frp-manager)" = "$DEB_VERSION" ]
          test -f /etc/frp/frps.toml && grep bindPort /etc/frp/frps.toml
          test -f /etc/systemd/system/frps.service
          # Pas de systemd dans le conteneur : le panel est lancé à la main
          frp-manager > /tmp/panel.log 2>&1 &
          code=000
          for i in $(seq 1 30); do
            code=$(curl -sk -o /dev/null -w '%{http_code}' https://127.0.0.1:8765/setup || true)
            [ "$code" = 200 ] && break
            sleep 1
          done
          cat /tmp/panel.log
          [ "$code" = 200 ] || { echo "le panel ne répond pas (HTTP $code)"; exit 1; }
          echo "panel : https://127.0.0.1:8765/setup → HTTP 200"
          pkill frp-manager || true
          apt-get purge -y frp-manager
          [ ! -e /usr/bin/frp-manager ] && [ ! -e /etc/frp-manager ] && echo "désinstallation complète"
