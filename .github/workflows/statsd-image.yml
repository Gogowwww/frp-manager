# GitHub Actions : image Docker du récepteur de statistiques (tools/statsd),
# ghcr.io/gogowwww/frp-manager-statsd, pour amd64 et arm64. Reconstruite à chaque
# changement du programme sur main, ou à la demande.
# GitHub Actions: Docker image of the statistics receiver (tools/statsd),
# ghcr.io/gogowwww/frp-manager-statsd, for amd64 and arm64. Rebuilt on every change
# of the program on main, or on demand.
#
# Prérequis : le package ghcr.io doit être public (Package settings → Danger Zone →
# Change visibility) pour que Portainer le tire sans identifiants.
# Requirements: the ghcr.io package must be public (Package settings → Danger Zone →
# Change visibility) so that Portainer pulls it without credentials.

name: Image statsd

on:
  push:
    branches: [main]
    paths: ['tools/statsd/**', 'go.mod', '.github/workflows/statsd-image.yml']
  workflow_dispatch:

permissions: {}

env:
  IMAGE: ghcr.io/gogowwww/frp-manager-statsd

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Construire et pousser l'image
        run: |
          set -eu
          docker buildx build --platform linux/amd64,linux/arm64 \
            -f tools/statsd/Dockerfile \
            -t "$IMAGE:latest" -t "$IMAGE:$(git rev-parse --short=7 HEAD)" --push .
          echo "OK : $IMAGE:latest"
