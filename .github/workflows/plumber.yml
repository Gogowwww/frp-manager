# GitHub Actions : scan Plumber (getplumber.io) des workflows GitHub et des
# réglages du dépôt public (protection du main…), à chaque pull request et à
# chaque avance du main public.
#
# Plumber ne lit que .github/workflows et ne publie son score (badge du README)
# que depuis une CI GitHub ou GitLab, par OIDC (id-token).
#
# score-push : le score et le nom du dépôt sont publiés sur
# score.getplumber.io (public, comme le dépôt), depuis le main seulement.
#
# Prérequis : Settings → Actions activé pour ce dépôt.

name: Plumber

on:
  pull_request:
  push:
    branches: [main]

permissions: {}

jobs:
  plumber:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read # états des workflows et un journal d'exécution, pour la portée du jeton
      security-events: write # rapport SARIF dans Code scanning
      id-token: write # score-push
    steps:
      # Actions épinglées par SHA (contrôle actionsMustBePinnedByCommitSha de Plumber)
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: getplumber/plumber@d1133cdac48cfdf0c0004637ae4af38bcf9f16c7 # v0.7.11
        with:
          score-push: true
