# Prévient le dépôt privé du site quand le contenu qu'il publie change (README,
# .github/, panel/templates/) : il se reconstruit et se déploie alors
# sur Cloudflare Pages. Sans le secret SITE_TOKEN, le site se
# reconstruit tout de même toutes les 6 heures.
#
# Prérequis : secret SITE_TOKEN, jeton GitHub à portée limitée au
# dépôt Gogowwww/frp-manager-site (droit « Contents : Read and write »).
#
# Notifies the site's private repository when the content it publishes changes
# (README, .github/, panel/templates/): it then rebuilds and deploys
# to Cloudflare Pages. Without the SITE_TOKEN secret, the site is still
# rebuilt every 6 hours.
#
# Requirements: secret SITE_TOKEN, a GitHub token limited to the
# Gogowwww/frp-manager-site repository ("Contents: Read and write" right).

name: Prévenir le site

on:
  push:
    branches: [main]
    paths: ['panel/templates/**', '.github/*.md', '*.md', '.github/workflows/site-notify.yml']
  workflow_dispatch:

permissions: {}

jobs:
  notify:
    runs-on: ubuntu-24.04
    steps:
      - name: Envoyer l'événement au dépôt du site
        env:
          GH_TOKEN: ${{ secrets.SITE_TOKEN }}
        run: |
          set -eu
          if [ -z "$GH_TOKEN" ]; then
            echo "SITE_TOKEN absent : le site se reconstruira à la prochaine passe planifiée"
            exit 0
          fi
          curl -fsS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/Gogowwww/frp-manager-site/dispatches \
            -d '{"event_type":"site"}'
          echo "Site prévenu"
