name: Build & Push Docker Image

# Dépôt public GitHub : images de release uniquement.
# Les images de développement (:dev) sont construites par Forgejo (.forgejo/workflows/).
on:
  push:
    tags: ['v*']       # Sur release taguée
  workflow_dispatch:   # Ou manuellement (récupère la dernière release)

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/gogowwww/frp-manager

jobs:
  build:
    # Runner auto-hébergé (homelab) : les runners hébergés par GitHub sont
    # bloqués tant que le compte a un souci de facturation.
    # Prérequis sur la machine : Docker, et l'utilisateur du runner dans le groupe docker.
    runs-on: [self-hosted, linux]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Récupérer la version
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            # Déclenché par un tag → utiliser ce tag
            VERSION=${GITHUB_REF#refs/tags/v}
          else
            # Déclenché manuellement → récupérer la dernière release GitHub
            VERSION=$(curl -s https://api.github.com/repos/Gogowwww/frp-manager/releases/latest \
              | grep '"tag_name"' | head -1 | sed 's/.*"v\([^"]*\)".*/\1/')
            if [[ -z "$VERSION" ]]; then
              echo "Aucune release trouvée, abandon."
              exit 1
            fi
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Version : ${VERSION}"

      - name: Log in to GitHub Container Registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Build image
        run: |
          docker build \
            --build-arg PANEL_VERSION=${{ steps.version.outputs.version }} \
            -t $IMAGE:latest \
            -t $IMAGE:${{ steps.version.outputs.version }} \
            .

      - name: Push image
        run: |
          docker push $IMAGE:latest
          docker push $IMAGE:${{ steps.version.outputs.version }}

      # Ne pas laisser le jeton GHCR sur la machine du runner
      - name: Log out of GitHub Container Registry
        if: always()
        run: docker logout ghcr.io
