name: Build & Push Docker Image

on:
  push:
    tags: ['v*']        # Release taguée → :<version> + :latest
    branches: [dev]     # Branche de développement → :dev + :dev-<sha>
  workflow_dispatch:    # Manuel : branche dev → image dev, sinon dernière release

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/gogowwww/frp-manager

jobs:
  build:
    # Runner auto-hébergé (homelab) : les runners hébergés par GitHub sont
    # bloqués tant que le compte a un souci de facturation.
    # Prérequis sur la machine : Docker, et l'utilisateur du runner dans le groupe docker.
    runs-on: [self-hosted, linux]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Déterminer la version et les tags
        id: meta
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            # Release : la version vient du tag
            VERSION=${GITHUB_REF#refs/tags/v}
            TAGS="$IMAGE:$VERSION $IMAGE:latest"
          elif [[ "$GITHUB_REF" == refs/heads/dev ]]; then
            # Développement : jamais :latest, pour ne pas toucher aux utilisateurs
            VERSION="dev-${GITHUB_SHA::7}"
            TAGS="$IMAGE:dev $IMAGE:$VERSION"
          else
            # Lancement manuel hors dev : reconstruire la dernière release publique
            VERSION=$(curl -s https://api.github.com/repos/Gogowwww/frp-manager/releases/latest \
              | grep '"tag_name"' | head -1 | sed 's/.*"v\([^"]*\)".*/\1/')
            if [[ -z "$VERSION" ]]; then
              echo "Aucune release trouvée, abandon."
              exit 1
            fi
            TAGS="$IMAGE:$VERSION $IMAGE:latest"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tags=$TAGS" >> "$GITHUB_OUTPUT"
          echo "Version : $VERSION"
          echo "Tags    : $TAGS"

      - name: Log in to GitHub Container Registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Build image
        run: |
          TAG_ARGS=""
          for t in ${{ steps.meta.outputs.tags }}; do TAG_ARGS="$TAG_ARGS -t $t"; done
          docker build --build-arg PANEL_VERSION=${{ steps.meta.outputs.version }} $TAG_ARGS .

      - name: Push image
        run: |
          docker push ghcr.io/gogowwww/frp-manager:latest
          docker push ghcr.io/gogowwww/frp-manager:${{ steps.version.outputs.version }}

      # Ne pas laisser le jeton GHCR sur la machine du runner
      - name: Log out of GitHub Container Registry
        if: always()
        run: docker logout ghcr.io
