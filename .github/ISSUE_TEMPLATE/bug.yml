name: Bug
description: Quelque chose ne fonctionne pas comme prévu / Something does not work as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Merci pour le signalement. **Une faille de sécurité ne se signale pas ici** : voir docs/SECURITY.fr.md.
        Retirez tokens, adresses IP publiques et noms de domaine de ce que vous collez.
        *Thanks for the report. Security issues go through docs/SECURITY.md, not here. English is fine.*
  - type: input
    id: version
    attributes:
      label: Version du panel / Panel version
      description: Affichée sous le nom, en haut de la barre latérale / Shown under the name in the sidebar
      placeholder: "0.0.51"
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: Installation
      options:
        - Script (install.sh)
        - Docker / Portainer
        - Autre / Other
    validations:
      required: true
  - type: input
    id: frp
    attributes:
      label: Version de frp et distribution / frp version and distribution
      placeholder: "frp 0.71.0, Debian 12"
  - type: textarea
    id: what
    attributes:
      label: Que se passe-t-il ? / What happens?
      description: Étapes pour reproduire, résultat obtenu et résultat attendu / Steps to reproduce, actual and expected result
      placeholder: |
        1. …
        2. …
        Obtenu : …
        Attendu : …
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Journaux / Logs
      description: "journalctl -u frp-manager -n 100 (ou docker logs frp-manager), sans secrets"
      render: text
