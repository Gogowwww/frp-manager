name: Bug report
description: Something does not work as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. **Security issues are not reported here**: see .github/SECURITY.md.
        Remove tokens, public IP addresses and domain names from what you paste.
  - type: input
    id: version
    attributes:
      label: Panel version
      description: Shown under the name at the top of the sidebar
      placeholder: "0.0.51"
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: Installation
      options:
        - Script (install.sh)
        - Docker / Portainer
        - Other
    validations:
      required: true
  - type: input
    id: frp
    attributes:
      label: frp version and distribution
      placeholder: "frp 0.71.0, Debian 12"
  - type: textarea
    id: what
    attributes:
      label: What happens?
      description: Steps to reproduce, actual and expected result
      placeholder: |
        1. …
        2. …
        Actual: …
        Expected: …
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: "journalctl -u frp-manager -n 100 (or docker logs frp-manager), without secrets"
      render: text
