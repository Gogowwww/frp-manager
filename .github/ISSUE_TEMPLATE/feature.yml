name: Fonctionnalité / Feature request / 功能建议
description: Proposer une amélioration / Suggest an improvement / 提出改进建议
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Besoin / Problem / 需求
      description: Ce que vous cherchez à faire et ce qui bloque aujourd'hui / What you are trying to do and what gets in the way / 您想做什么以及目前的阻碍
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposition / Proposal / 建议
      description: Comment le panel pourrait y répondre / How the panel could help / 面板可以如何满足
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives envisagées / Alternatives considered / 考虑过的替代方案
  - type: checkboxes
    id: frp
    attributes:
      label: Périmètre / Scope / 范围
      options:
        - label: La fonctionnalité existe dans frp lui-même (option de configuration documentée) / The feature exists in frp itself (documented option) / 该功能已存在于 frp 本身（有文档化的配置选项）
