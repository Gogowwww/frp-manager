name: Rapport de bug
description: Quelque chose ne fonctionne pas comme prévu
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Merci pour le signalement. **Une faille de sécurité ne se signale pas ici** : voir .github/SECURITY.md.
        Retirez tokens, adresses IP publiques et noms de domaine de ce que vous collez.
  - type: input
    id: version
    attributes:
      label: Version du panel
      description: Affichée sous le nom, en haut de la barre latérale
      placeholder: "0.0.51"
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: Installation
      options:
        - Script (install.sh)
        - Docker / Portainer
        - Autre
    validations:
      required: true
  - type: input
    id: frp
    attributes:
      label: Version de frp et distribution
      placeholder: "frp 0.71.0, Debian 12"
  - type: textarea
    id: what
    attributes:
      label: Que se passe-t-il ?
      description: Étapes pour reproduire, résultat obtenu et résultat attendu
      placeholder: |
        1. …
        2. …
        Obtenu : …
        Attendu : …
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Journaux
      description: "journalctl -u frp-manager -n 100 (ou docker logs frp-manager), sans secrets"
      render: text
