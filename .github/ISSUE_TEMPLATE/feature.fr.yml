name: Demande de fonctionnalité
description: Proposer une amélioration
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Besoin
      description: Ce que vous cherchez à faire et ce qui bloque aujourd'hui
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposition
      description: Comment le panel pourrait y répondre
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives envisagées
  - type: checkboxes
    id: frp
    attributes:
      label: Périmètre
      options:
        - label: La fonctionnalité existe dans frp lui-même (option de configuration documentée)
