<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>FRP Manager</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 26 26'%3E%3Cpath d='M13 2L23 7.5V18.5L13 24L3 18.5V7.5L13 2Z' stroke='%2310b981' stroke-width='1.5' stroke-linejoin='round' fill='%23101418'/%3E%3Cpath d='M7.5 11h11M16 8.5l2.5 2.5L16 13.5' stroke='%2310b981' stroke-width='1.4' stroke-linecap='round' stroke-linejoin='round'/%3E%3Cpath d='M18.5 15H7.5M10 12.5L7.5 15l2.5 2.5' stroke='%2310b981' stroke-width='1.4' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<script>
  // Thème appliqué avant le premier rendu (voir assets/js/theme.js)
  try { var th = localStorage.getItem('frpm.theme'); if (th === 'light' || th === 'dark') document.documentElement.dataset.theme = th; } catch (e) {}
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}?v={{ panel_version }}">
<script type="module" src="{{ url_for('static', filename='js/main.js') }}?v={{ panel_version }}"></script>
</head>
<body>

{% include "partials/icons.html" %}

<div class="app" id="app">
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <svg class="brand-logo" viewBox="0 0 26 26" fill="none" aria-hidden="true"><use href="#i-logo"/></svg>
      <div>
        <div class="brand-name">FRP Manager</div>
        <div class="brand-version">v{{ panel_version }}</div>
      </div>
    </div>

    <nav class="nav" data-i18n-aria-label="nav.label">
      <a class="nav-link" href="#/dashboard" data-route="dashboard"><svg class="icon"><use href="#i-dashboard"/></svg><span data-i18n="nav.dashboard"></span></a>
      <a class="nav-link" href="#/ports" data-route="ports"><svg class="icon"><use href="#i-tunnels"/></svg><span data-i18n="nav.tunnels"></span></a>
      <a class="nav-link" href="#/firewall" data-route="firewall" hidden><svg class="icon"><use href="#i-shield"/></svg><span data-i18n="nav.firewall"></span></a>
      <a class="nav-link" href="#/config" data-route="config"><svg class="icon"><use href="#i-config"/></svg><span data-i18n="nav.config"></span></a>
      <a class="nav-link" href="#/logs" data-route="logs"><svg class="icon"><use href="#i-logs"/></svg><span data-i18n="nav.logs"></span></a>
      <div class="nav-sep" role="presentation"></div>
      <a class="nav-link" href="#/updates" data-route="updates"><svg class="icon"><use href="#i-download"/></svg><span data-i18n="nav.updates"></span><span class="nav-badge" id="updates-badge" data-i18n-title="nav.updateAvailable" hidden></span></a>
      <a class="nav-link" href="#/settings" data-route="settings"><svg class="icon"><use href="#i-settings"/></svg><span data-i18n="nav.settings"></span></a>
    </nav>

    <div class="sidebar-foot">
      <button type="button" class="nav-link btn-reset" id="logout"><svg class="icon"><use href="#i-logout"/></svg><span data-i18n="nav.logout"></span></button>
      <p class="sidebar-credit">
        <span data-i18n="footer.madeWith"></span>
        <a href="https://claude.ai" target="_blank" rel="noopener">Claude</a>,
        <a href="https://github.com/Gogowwww/frp-manager" target="_blank" rel="noopener">GitHub</a>
      </p>
    </div>
  </aside>
  <div class="sidebar-backdrop" id="sidebar-backdrop"></div>

  <div class="main">
    <header class="topbar">
      <button type="button" class="btn btn-ghost btn-icon" id="nav-toggle" data-i18n-aria-label="nav.open"><svg class="icon icon-lg"><use href="#i-menu"/></svg></button>
      <div class="brand">
        <svg class="brand-logo" viewBox="0 0 26 26" fill="none" aria-hidden="true"><use href="#i-logo"/></svg>
        <span class="brand-name">FRP Manager</span>
      </div>
    </header>
    <main class="view" id="view" tabindex="-1"></main>
  </div>
</div>

<div class="toasts" id="toasts" aria-live="polite"></div>
<noscript><p style="padding:24px">FRP Manager nécessite JavaScript.</p></noscript>
</body>
</html>
