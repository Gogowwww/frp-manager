# Mode hôte : le panel pilote frps/frpc installés SUR L'HÔTE (services systemd,
# journal, programmes de /usr/local/bin, nftables) avec nsenter. C'est la
# configuration des installations faites avant le mode autonome ; le
# docker-compose.yml plus simple, à la racine du dépôt, lance plutôt frps et
# frpc dans le conteneur.
# Host mode: the panel drives frps/frpc installed ON THE HOST (systemd services,
# journal, /usr/local/bin binaries, nftables) through nsenter. This is the
# configuration of installs made before the standalone mode; the simpler
# docker-compose.yml, at the root of the repository, runs frps and frpc inside
# the container instead.
#
#   curl -O https://raw.githubusercontent.com/Gogowwww/frp-manager/main/packaging/docker/docker-compose.host.yml
#   docker compose -f docker-compose.host.yml up -d

services:
  frp-manager:
    # Prebuilt image on GitHub Container Registry
    image: ghcr.io/gogowwww/frp-manager:latest
    # Construire depuis les sources (dans une copie du dépôt) : commenter la
    # ligne image et décommenter build, qui pointe vers la racine du dépôt.
    # To build from source (in a clone of the repository): comment out the
    # image line and uncomment build, which points to the repository root.
    # build: ../..
    container_name: frp-manager
    restart: unless-stopped

    # Host network: the panel listens directly on the machine's ports
    network_mode: host

    # WARNING: pid: host + privileged give this container ROOT-EQUIVALENT
    # ACCESS TO THE HOST. The panel uses them to drive the host's systemd
    # with nsenter (frp services, logs, nftables, files). Anyone who logs into
    # the panel, or exploits a flaw in it, therefore controls the host.
    # Détails et pistes pour le réduire : https://frp-manager.org/fr/docs/installation/#docker-et-portainer.
    # Details and ways to reduce it: https://frp-manager.org/docs/installation/#docker-and-portainer.
    pid: host
    privileged: true

    volumes:
      # ── Persistent panel data ──────────────────────────────────────────
      - /etc/frp-manager:/etc/frp-manager        # Panel config + SSL certs
      - /etc/frp:/etc/frp                          # frps/frpc configs (TOML)
      - /var/log/frp:/var/log/frp                  # frp logs
      - /var/lib/frp-manager:/var/lib/frp-manager  # State (installed versions)

      # ── Host systemd (through nsenter) ─────────────────────────────────
      - /run/systemd:/run/systemd
      - /run/dbus:/run/dbus

      # ── Host journal ───────────────────────────────────────────────────
      - /var/log/journal:/var/log/journal:ro
      - /run/log/journal:/run/log/journal:ro
      - /etc/machine-id:/etc/machine-id:ro

      # ── Host frp binaries ──────────────────────────────────────────────
      # frp-manager detects /host/usr/local/bin automatically and uses it to
      # read and install frps/frpc on the host system
      - /usr/local/bin:/host/usr/local/bin

      # ── Docker socket (detection and control of frpc/frps containers) ──
      # Lets frp-manager see and manage frpc/frps containers running in
      # other stacks (start/stop/restart + logs).
      # The Docker socket is root-equivalent access to the host as well.
      - /var/run/docker.sock:/var/run/docker.sock

    environment:
      # Mode hôte, quoi que dise la détection / Host mode, whatever the detection says
      - FRP_MANAGER_MODE=host
      - FRP_MANAGER_PORT=8765
      # New install: the panel only listens on 127.0.0.1 (reach it through an
      # SSH tunnel or a local reverse proxy). To open it to your local
      # network, uncomment the next line, create the account right away and
      # filter access (firewall, VPN):
      # - FRP_MANAGER_HOST=0.0.0.0
      # Disable third-party download mirrors (ghproxy, ghfast, gh-proxy):
      # - FRP_MANAGER_NO_MIRRORS=1
