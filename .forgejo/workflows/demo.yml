# Forgejo Actions : site de FRP Manager (https://frp-manager.gogow.fr) —
# page d'accueil, documentation et démo en ligne (interface réelle, données fictives).
#
# À chaque push sur main qui touche l'interface, la démo, le site ou la
# documentation, website/build.py construit l'application (app.py + site/,
# bibliothèque standard Python uniquement ; la démo est dans site/demo/) et la
# publie sur la branche main du dépôt administrator/frp-manager-demo. Le
# cloudpod Webstrator clone ce dépôt et lance « python3 app.py ».
#
# Prérequis : secret de dépôt DEMO_REPO_TOKEN, jeton Forgejo avec le droit
# d'écriture sur frp-manager-demo (le jeton automatique ne vaut que pour ce dépôt-ci).

name: Site et démo

on:
  push:
    branches: [main]
    paths: ['panel/templates/**', 'website/**', 'docs/**', '*.md', '.forgejo/workflows/demo.yml']
  workflow_dispatch:

env:
  DEMO_REPO: administrator/frp-manager-demo

jobs:
  publish:
    runs-on: docker
    container:
      image: python:3.12-alpine
    steps:
      - name: Récupérer le code
        # Historique complet : les dates « lastmod » du sitemap viennent de git log
        run: |
          apk add --no-cache --quiet git
          rm -rf src
          git -c "http.extraHeader=Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            clone --quiet --branch "${{ github.ref_name }}" \
            "${{ github.server_url }}/${{ github.repository }}.git" src
          git -C src -c "http.extraHeader=Authorization: token ${{ secrets.GITHUB_TOKEN }}" fetch --quiet --tags
          git -C src log -1 --format='Commit %h : %s'

      - name: Construire et publier le site
        env:
          DEMO_REPO_TOKEN: ${{ secrets.DEMO_REPO_TOKEN }}
        run: |
          set -eu
          # Espaces et retours à la ligne collés avec la valeur du secret : retirés
          DEMO_REPO_TOKEN=$(printf '%s' "$DEMO_REPO_TOKEN" | tr -d '[:space:]')
          [ -n "$DEMO_REPO_TOKEN" ] || { echo "Secret DEMO_REPO_TOKEN manquant"; exit 1; }
          AUTH="Authorization: token $DEMO_REPO_TOKEN"
          URL="${{ github.server_url }}/$DEMO_REPO.git"
          # Accès au dépôt vérifié d'abord : sinon on repartirait d'un dépôt
          # vide et l'échec n'apparaîtrait qu'au push, sans explication.
          git -c "http.extraHeader=$AUTH" ls-remote --heads "$URL" >/dev/null \
            || { echo "DEMO_REPO_TOKEN refusé ou sans accès à $DEMO_REPO ($URL)"; exit 1; }
          rm -rf out
          if [ -n "$(git -c "http.extraHeader=$AUTH" ls-remote --heads "$URL" main)" ]; then
            git -c "http.extraHeader=$AUTH" clone --quiet --depth 1 "$URL" out
          else
            git init --quiet -b main out      # dépôt encore vide
          fi

          # Numéro affiché : dernière version publiée
          VERSION=$(git -C src tag --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -1)
          SHA=$(git -C src rev-parse --short HEAD)
          python3 src/website/build.py --out dist-site --version "${VERSION:-dev}" --bundle out
          # Audit SEO : un titre en double, un lien cassé ou un JSON-LD invalide bloque la publication
          python3 src/website/seo_check.py dist-site
          cat > out/README.md <<EOF
          # FRP Manager — site et démo

          Construit automatiquement depuis frp-manager (commit $SHA) par
          .forgejo/workflows/demo.yml : ne pas modifier ce dépôt à la main.

          Lancer : \`python3 app.py\` (port \`\$PORT\` ou \`\$SERVER_PORT\`, 8080 par défaut).
          Aucune dépendance : bibliothèque standard Python uniquement.
          EOF

          cd out
          git add -A
          if git diff --cached --quiet; then
            echo "Site inchangé, rien à publier"
            exit 0
          fi
          git -c user.name="FRP Manager (démo)" -c user.email="demo@frp-manager.invalid" \
            commit --quiet -m "Site ${VERSION:-dev} (frp-manager $SHA)"
          git -c "http.extraHeader=$AUTH" push --quiet "$URL" HEAD:main
          echo "Publié : $DEMO_REPO ($(git rev-parse --short HEAD))"
