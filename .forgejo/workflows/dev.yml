# Forgejo Actions (dépôt de dev sur le homelab) : chaque push sur main
# construit un instantané ghcr.io/gogowwww/frp-manager:dev-<sha>.
# Ni :dev (= dernière pré-release) ni :latest (= dernière release) : ceux-là
# sont posés par release.yml et promote.yml.
#
# Prérequis :
#   - un forgejo-runner avec le label « docker », dont le config.yml contient :
#       container:
#         valid_volumes:
#           - /var/run/docker.sock
#   - un secret de dépôt GHCR_TOKEN : token GitHub *classic* (repo + write:packages), partagé avec release.yml.

name: Image Docker dev

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  IMAGE: ghcr.io/gogowwww/frp-manager
  PLATFORMS: linux/amd64,linux/arm64,linux/arm/v7
  GHCR_USER: Gogowwww

jobs:
  build:
    runs-on: docker
    # Conteneur avec le client Docker, relié au démon de l'hôte par son socket
    # (le config.yml du runner doit l'autoriser : container.valid_volumes).
    container:
      image: docker:27-cli
      volumes:
        - /var/run/docker.sock:/var/run/docker.sock
    steps:
      # git simple plutôt qu'actions/checkout : pas besoin de Node dans le conteneur
      - name: Récupérer le code
        run: |
          apk add --no-cache --quiet git
          rm -rf src
          git -c "http.extraHeader=Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            clone --quiet --depth 1 --branch "${{ github.ref_name }}" \
            "${{ github.server_url }}/${{ github.repository }}.git" src
          git -C src log -1 --format='Commit %h : %s'

      - name: Construire et pousser l'image
        env:
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
        run: |
          set -eu
          VERSION="dev-$(git -C src rev-parse --short=7 HEAD)"
          echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
          # Architectures de l'image : amd64 (natif), arm64 et armv7 par émulation QEMU,
          # enregistrée dans le noyau de l'hôte du runner (idempotent)
          docker run --privileged --rm tonistiigi/binfmt --install arm64,arm >/dev/null
          # Builder buildx propre à ce job (supprimé en sortie)
          BUILDER="frpm-$(date +%s)-$$"
          # network=host : l'apt-get du Dockerfile a besoin du réseau de l'hôte sur ce homelab
          docker buildx create --name "$BUILDER" --driver docker-container \
            --driver-opt network=host --buildkitd-flags '--allow-insecure-entitlement network.host' >/dev/null
          trap 'docker buildx rm "$BUILDER" >/dev/null 2>&1 || true; docker logout ghcr.io >/dev/null 2>&1 || true' EXIT
          docker buildx build --builder "$BUILDER" --platform "$PLATFORMS" \
            --network=host --allow network.host --pull \
            --build-arg PANEL_VERSION="$VERSION" \
            -t "$IMAGE:$VERSION" --push src
          echo "OK : $IMAGE:$VERSION ($PLATFORMS)"
