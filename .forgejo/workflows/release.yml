# Forgejo Actions : publication d'une PRÉ-RELEASE sur GitHub à partir d'un tag.
#
# Numérotation : chaque pré-release prend le numéro suivant (v0.0.24, v0.0.25,
# v0.0.26, …). Quand une pré-release est validée, promote.yml la rend définitive
# telle quelle (pas de rebuild).
#
#   git tag -a v0.0.24 -m "…" && git push origin v0.0.24
#
# Pré-release :
#   - pré-release GitHub ; un panel installé en pré-release suit les pré-releases ;
#   - image :X.Y.Z + :dev (:dev = toujours la dernière pré-release) ; :latest ne bouge pas ;
#     amd64, arm64 et armv7 (programme compilé en croisé, image finale par émulation QEMU) ;
#   - paquets .deb (amd64, arm64, armhf) joints à la release et publiés dans le
#     dépôt APT du Forgejo, distribution « testing » (promote.yml les copie dans
#     « stable ») ;
#   - seul le tag est poussé sur GitHub, le main public ne bouge pas.
#
# Fichiers joints : frp-manager.zip (programme des trois architectures, install.sh,
# et app.py : passage automatique d'un panel Python au programme Go), sa somme
# frp-manager.zip.sha256 (vérifiée par la mise à jour du panel), et les .deb.
#
# Prérequis :
#   - runner Forgejo avec le label « docker » et container.valid_volumes: [/var/run/docker.sock]
#   - secret de dépôt GHCR_TOKEN : token GitHub *classic*, scopes « repo » et « write:packages »
#   - secret FORGEJO_PACKAGES_TOKEN : jeton Forgejo, portée write:package (dépôt APT ;
#     sans lui, le jeton automatique du workflow est essayé)

name: Release

on:
  push:
    tags: ['v*']

env:
  GH_REPO: Gogowwww/frp-manager
  IMAGE: ghcr.io/gogowwww/frp-manager
  PLATFORMS: linux/amd64,linux/arm64,linux/arm/v7
  GH_USER: Gogowwww

jobs:
  # Notes de la release (titre, résumé, sections, en français puis en anglais),
  # tirées des deux CHANGELOG par tools/releasenotes : une section absente
  # bloque la release avant toute construction.
  notes:
    runs-on: docker
    container:
      image: golang:1.26-alpine
    outputs:
      json: ${{ steps.notes.outputs.json }}
    steps:
      - name: Notes depuis les CHANGELOG
        id: notes
        run: |
          set -eu
          apk add --no-cache --quiet git
          rm -rf src
          git -c "http.extraHeader=Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            clone --quiet "${{ github.server_url }}/${{ github.repository }}.git" src
          cd src
          git checkout --quiet "${{ github.ref_name }}"
          go run ./tools/releasenotes "${{ github.ref_name }}"
          echo "json=$(go run ./tools/releasenotes -json "${{ github.ref_name }}")" >> "$GITHUB_OUTPUT"

  release:
    needs: notes
    runs-on: docker
    container:
      image: docker:27-cli
      volumes:
        - /var/run/docker.sock:/var/run/docker.sock
    steps:
      - name: Préparer
        env:
          GH_TOKEN: ${{ secrets.GHCR_TOKEN }}
        run: |
          set -eu
          apk add --no-cache --quiet git zip curl jq dpkg

          TAG="${{ github.ref_name }}"
          echo "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$' \
            || { echo "Tag invalide : $TAG (attendu vX.Y.Z)"; exit 1; }
          VERSION="${TAG#v}"
          [ -n "$GH_TOKEN" ] || { echo "Secret GHCR_TOKEN manquant"; exit 1; }

          rm -rf src dist
          git -c "http.extraHeader=Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            clone --quiet "${{ github.server_url }}/${{ github.repository }}.git" src
          git -C src checkout --quiet "$TAG"
          SHA="$(git -C src rev-parse HEAD)"

          # Vérifications GitHub AVANT de construire quoi que ce soit
          CODE=$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: token $GH_TOKEN" \
            "https://api.github.com/repos/$GH_REPO/releases/tags/$TAG")
          [ "$CODE" = 404 ] || { echo "Une release $TAG existe déjà sur GitHub (HTTP $CODE)"; exit 1; }

          # Émulation arm64/armv7 (étapes RUN de l'image finale) et builder buildx propre au job
          docker run --privileged --rm tonistiigi/binfmt --install arm64,arm >/dev/null
          BUILDER="frpm-$(date +%s)-$$"
          # network=host : le réseau de l'hôte, nécessaire sur ce homelab (go mod download, apk)
          docker buildx create --name "$BUILDER" --driver docker-container \
            --driver-opt network=host --buildkitd-flags '--allow-insecure-entitlement network.host' >/dev/null

          {
            echo "TAG=$TAG"
            echo "VERSION=$VERSION"
            echo "SHA=$SHA"
            echo "BUILDER=$BUILDER"
          } >> "$GITHUB_ENV"
          echo "Pré-release $TAG ($SHA)"

      - name: Tests
        run: |
          set -eu
          docker buildx build --builder "$BUILDER" --network=host --allow network.host \
            --target test --progress plain src

      - name: Programme (trois architectures)
        run: |
          set -eu
          docker buildx build --builder "$BUILDER" --network=host --allow network.host \
            --target binaries --build-arg PANEL_VERSION="$VERSION" --output type=local,dest=dist/bin src
          ls -l dist/bin

      - name: Archive frp-manager.zip et paquets .deb
        run: |
          set -eu
          mkdir -p dist/frp-manager/bin
          cp dist/bin/frp-manager-linux-* dist/frp-manager/bin/
          chmod 755 dist/frp-manager/bin/*
          cd src
          cp -r panel/install.sh docs CHANGELOG.md CHANGELOG.fr.md README.md README.fr.md LICENSE \
             docker-compose.yml ../dist/frp-manager/
          cp docs/SECURITY.md docs/SECURITY.fr.md ../dist/frp-manager/
          # Passage d'un panel Python (≤ 0.0.57) au programme Go : sa mise à jour
          # copie app.py puis relance le service, qui installe alors ce programme
          sed "s/__VERSION__/$VERSION/" packaging/python-bridge/app.py > ../dist/frp-manager/app.py
          grep -q "VERSION = \"$VERSION\"" ../dist/frp-manager/app.py
          cd ../dist
          zip -qr frp-manager.zip frp-manager
          sha256sum frp-manager.zip > frp-manager.zip.sha256
          sh ../src/packaging/deb/build-deb.sh "$VERSION" bin deb
          ls -l frp-manager.zip frp-manager.zip.sha256 deb/

      # Construite pour toutes les architectures AVANT de publier quoi que ce
      # soit ; le push plus bas repart du cache de ce builder.
      - name: Image Docker
        run: |
          set -eu
          docker buildx build --builder "$BUILDER" --platform "$PLATFORMS" \
            --network=host --allow network.host --pull \
            --build-arg PANEL_VERSION="$VERSION" src

      # ── Publication : tout est construit, on pousse ────────────────────────
      # Le tag d'abord : s'il est refusé (protection e-mail…), rien n'est publié.
      # En cas d'échec plus loin, relancer le job est sans risque.
      - name: Pousser le tag sur GitHub
        env:
          GH_TOKEN: ${{ secrets.GHCR_TOKEN }}
        run: |
          set -eu
          AUTH="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')"
          git -C src remote add public "https://github.com/$GH_REPO.git" 2>/dev/null || true
          # Seulement le tag : le main public n'avance qu'à la promotion
          git -C src -c "http.https://github.com/.extraheader=$AUTH" push public "refs/tags/$TAG"

      - name: Pousser l'image
        env:
          GH_TOKEN: ${{ secrets.GHCR_TOKEN }}
        run: |
          set -eu
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GH_USER" --password-stdin
          trap 'docker buildx rm "$BUILDER" >/dev/null 2>&1 || true; docker logout ghcr.io >/dev/null 2>&1 || true' EXIT
          docker buildx build --builder "$BUILDER" --platform "$PLATFORMS" \
            --network=host --allow network.host \
            --build-arg PANEL_VERSION="$VERSION" \
            -t "$IMAGE:$VERSION" -t "$IMAGE:dev" --push src

      - name: Créer la pré-release GitHub
        env:
          GH_TOKEN: ${{ secrets.GHCR_TOKEN }}
          NOTES: ${{ needs.notes.outputs.json }}
        run: |
          set -eu
          API="https://api.github.com/repos/$GH_REPO"
          BODY=$(printf '%s' "$NOTES" | jq --arg tag "$TAG" \
            '{tag_name: $tag, name: .name, body: .body, prerelease: true, make_latest: "false"}')
          REL=$(curl -sf -X POST -H "Authorization: token $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" -d "$BODY" "$API/releases")
          ID=$(echo "$REL" | jq -r .id)
          for f in dist/frp-manager.zip dist/frp-manager.zip.sha256 dist/deb/*.deb; do
            NAME=$(basename "$f")
            case "$NAME" in
              *.zip) TYPE=application/zip ;;
              *.sha256) TYPE=text/plain ;;
              *.deb) TYPE=application/vnd.debian.binary-package ;;
              *) TYPE=application/octet-stream ;;
            esac
            curl -sf -X POST -H "Authorization: token $GH_TOKEN" -H "Content-Type: $TYPE" \
              --data-binary "@$f" "https://uploads.github.com/repos/$GH_REPO/releases/$ID/assets?name=$NAME" >/dev/null
            echo "Joint : $NAME"
          done
          echo "Pré-release publiée : $(echo "$REL" | jq -r .html_url)"

      - name: Dépôt APT (testing)
        env:
          FORGEJO_URL: ${{ github.server_url }}
          APT_OWNER: ${{ github.repository_owner }}
          PACKAGES_TOKEN: ${{ secrets.FORGEJO_PACKAGES_TOKEN }}
          ACTIONS_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: sh src/packaging/deb/publish-apt.sh testing dist/deb/*.deb
