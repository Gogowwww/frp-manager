# Forgejo Actions : publication d'une PRÉ-RELEASE sur GitHub à partir d'un tag.
#
# Numérotation : chaque pré-release prend le numéro suivant (v0.0.24, v0.0.25,
# v0.0.26, …). Quand une pré-release est validée, promote.yml la rend définitive
# telle quelle (pas de rebuild).
#
#   git tag -a v0.0.24 -m "…" && git push origin v0.0.24
#
# Pré-release :
#   - pré-release GitHub ; un panel installé en pré-release ne propose aucune
#     mise à jour (il interroge GitHub sur le statut de sa propre version) ;
#   - image :X.Y.Z + :dev (:dev = toujours la dernière pré-release) ; :latest ne bouge pas ;
#   - seul le tag est poussé sur GitHub, le main public ne bouge pas.
#
# Fichier joint : frp-manager.zip (nom attendu par le README et l'auto-update du panel).
#
# Prérequis :
#   - runner Forgejo avec le label « docker » et container.valid_volumes: [/var/run/docker.sock]
#   - secret de dépôt GHCR_TOKEN : token GitHub *classic*, scopes « repo » et « write:packages »

name: Release

on:
  push:
    tags: ['v*']

env:
  GH_REPO: Gogowwww/frp-manager
  IMAGE: ghcr.io/gogowwww/frp-manager
  GH_USER: Gogowwww

jobs:
  release:
    runs-on: docker
    container:
      image: docker:27-cli
      volumes:
        - /var/run/docker.sock:/var/run/docker.sock
    steps:
      - name: Préparer
        env:
          GH_TOKEN: ${{ secrets.GHCR_TOKEN }}
        run: |
          set -eu
          apk add --no-cache --quiet git zip curl jq

          TAG="${{ github.ref_name }}"
          echo "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$' \
            || { echo "Tag invalide : $TAG (attendu vX.Y.Z)"; exit 1; }
          VERSION="${TAG#v}"
          [ -n "$GH_TOKEN" ] || { echo "Secret GHCR_TOKEN manquant"; exit 1; }

          rm -rf src dist
          git -c "http.extraHeader=Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            clone --quiet "${{ github.server_url }}/${{ github.repository }}.git" src
          git -C src checkout --quiet "$TAG"
          SHA="$(git -C src rev-parse HEAD)"

          # Vérifications GitHub AVANT de construire quoi que ce soit
          CODE=$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: token $GH_TOKEN" \
            "https://api.github.com/repos/$GH_REPO/releases/tags/$TAG")
          [ "$CODE" = 404 ] || { echo "Une release $TAG existe déjà sur GitHub (HTTP $CODE)"; exit 1; }

          {
            echo "TAG=$TAG"
            echo "VERSION=$VERSION"
            echo "SHA=$SHA"
          } >> "$GITHUB_ENV"
          echo "Pré-release $TAG ($SHA)"

      - name: Archive frp-manager.zip
        run: |
          set -eu
          mkdir -p dist/frp-manager
          cd src
          cp -r app.py frp-autoupdate.py install.sh requirements.txt templates \
                README.md LICENSE docker-compose.yml ../dist/frp-manager/
          cd ../dist
          # Version affichée par les installations via install.sh (hors Docker)
          sed -i "s/^_PANEL_VERSION_FALLBACK = \"[^\"]*\"/_PANEL_VERSION_FALLBACK = \"$VERSION\"/" frp-manager/app.py
          grep -q "_PANEL_VERSION_FALLBACK = \"$VERSION\"" frp-manager/app.py
          zip -qr frp-manager.zip frp-manager
          ls -l frp-manager.zip

      - name: Image Docker
        run: |
          set -eu
          docker build --network=host --pull --build-arg PANEL_VERSION="$VERSION" \
            -t "$IMAGE:$VERSION" -t "$IMAGE:dev" src

      # ── Publication : tout est construit, on pousse ────────────────────────
      # Le tag d'abord : s'il est refusé (protection e-mail…), rien n'est publié.
      # En cas d'échec plus loin, relancer le job est sans risque.
      - name: Pousser le tag sur GitHub
        env:
          GH_TOKEN: ${{ secrets.GHCR_TOKEN }}
        run: |
          set -eu
          AUTH="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')"
          git -C src remote add public "https://github.com/$GH_REPO.git" 2>/dev/null || true
          # Seulement le tag : le main public n'avance qu'à la promotion
          git -C src -c "http.https://github.com/.extraheader=$AUTH" push public "refs/tags/$TAG"

      - name: Pousser l'image
        env:
          GH_TOKEN: ${{ secrets.GHCR_TOKEN }}
        run: |
          set -eu
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GH_USER" --password-stdin
          trap 'docker logout ghcr.io >/dev/null 2>&1 || true' EXIT
          docker push --quiet "$IMAGE:$VERSION"
          docker push --quiet "$IMAGE:dev"

      - name: Créer la pré-release GitHub
        env:
          GH_TOKEN: ${{ secrets.GHCR_TOKEN }}
        run: |
          set -eu
          API="https://api.github.com/repos/$GH_REPO"
          BODY=$(jq -n --arg tag "$TAG" \
            '{tag_name: $tag, name: $tag, prerelease: true, make_latest: "false", generate_release_notes: true}')
          REL=$(curl -sf -X POST -H "Authorization: token $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" -d "$BODY" "$API/releases")
          ID=$(echo "$REL" | jq -r .id)
          for f in dist/frp-manager.zip; do
            NAME=$(basename "$f")
            case "$NAME" in *.zip) TYPE=application/zip ;; *) TYPE=application/gzip ;; esac
            curl -sf -X POST -H "Authorization: token $GH_TOKEN" -H "Content-Type: $TYPE" \
              --data-binary "@$f" "https://uploads.github.com/repos/$GH_REPO/releases/$ID/assets?name=$NAME" >/dev/null
            echo "Joint : $NAME"
          done
          echo "Pré-release publiée : $(echo "$REL" | jq -r .html_url)"
