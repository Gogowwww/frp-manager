# Forgejo Actions : intégration continue du panel Go, à chaque push sur une
# branche (pas les tags) et sur les pull requests. Mêmes étapes que release.yml : tests Go
# (go vet, go test, gofmt), programme des trois architectures, archive
# frp-manager.zip et paquets .deb.
#
# Sur main seulement : les paquets partent dans le canal « dev » du dépôt APT
# (comme l'image Docker dev-<sha>), puis s'installent par apt dans des
# conteneurs Debian 12 et Ubuntu 24.04 neufs : dépôt, paquet et démarrage du
# panel vérifiés de bout en bout. Les canaux « testing » et « stable » restent
# ceux des releases (release.yml, promote.yml).
#
# Les résultats sont aussi publiés en statuts du commit (contextes ci-*).
#
# Prérequis : runner Forgejo avec le label « docker » et
# container.valid_volumes: [/var/run/docker.sock] (comme release.yml) ;
# secret FORGEJO_PACKAGES_TOKEN (jeton Forgejo, portée write:package).

name: CI

on:
  push:
    # Branches seulement : un tag est testé et construit par release.yml (sur un
    # tag, les jobs apt réservés à main finissaient en « failure » au lieu d'être ignorés)
    branches: ['**']
  pull_request:

env:
  APT_REPO: ${{ github.server_url }}/api/packages/${{ github.repository_owner }}/debian

jobs:
  go:
    runs-on: docker
    container:
      image: docker:27-cli
      volumes:
        - /var/run/docker.sock:/var/run/docker.sock
    steps:
      # git simple plutôt qu'actions/checkout : pas besoin de Node dans le conteneur
      - name: Récupérer le code
        run: |
          set -eu
          apk add --no-cache --quiet git zip dpkg curl
          rm -rf src ci
          git -c "http.extraHeader=Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            clone --quiet "${{ github.server_url }}/${{ github.repository }}.git" src
          git -C src checkout --quiet "${{ github.sha }}"
          git -C src log -1 --format='Commit %h : %s'
          # Versions de cet instantané : dev-<sha> pour le panel (comme l'image
          # Docker), <dernière release>+dev.<n>.g<sha> pour le paquet (plus récent
          # que la dernière release, plus ancien que la suivante)
          SHORT=$(git -C src rev-parse --short=7 HEAD)
          BASE=$(git -C src describe --tags --abbrev=0 --match 'v[0-9]*' 2>/dev/null | sed 's/^v//')
          {
            echo "PANEL_VERSION=dev-$SHORT"
            echo "DEB_VERSION=${BASE:-0.0.0}+dev.${{ github.run_number }}.g$SHORT"
          } >> "$GITHUB_ENV"
          # Builder buildx propre au job ; network=host : réseau de l'hôte, nécessaire sur ce homelab
          BUILDER="frpm-ci-$(date +%s)-$$"
          docker buildx create --name "$BUILDER" --driver docker-container \
            --driver-opt network=host --buildkitd-flags '--allow-insecure-entitlement network.host' >/dev/null
          echo "BUILDER=$BUILDER" >> "$GITHUB_ENV"

      - name: go vet, go test, gofmt
        run: |
          set -eu
          docker buildx build --builder "$BUILDER" --network=host --allow network.host \
            --target test --progress plain src

      - name: Programme (trois architectures)
        run: |
          set -eu
          trap 'docker buildx rm "$BUILDER" >/dev/null 2>&1 || true' EXIT
          docker buildx build --builder "$BUILDER" --network=host --allow network.host \
            --target binaries --build-arg PANEL_VERSION="$PANEL_VERSION" --output type=local,dest=ci/bin src
          ls -l ci/bin

      - name: Archive et paquets .deb
        run: |
          set -eu
          sh -n src/packaging/deb/postinst && sh -n src/packaging/deb/prerm && sh -n src/packaging/deb/postrm
          mkdir -p ci/frp-manager/bin
          cp ci/bin/frp-manager-linux-* ci/frp-manager/bin/
          cp src/panel/install.sh ci/frp-manager/
          sed "s/__VERSION__/$PANEL_VERSION/" src/packaging/python-bridge/app.py > ci/frp-manager/app.py
          (cd ci && zip -qr frp-manager.zip frp-manager && ls -l frp-manager.zip)
          sh src/packaging/deb/build-deb.sh "$DEB_VERSION" ci/bin ci/deb
          for f in ci/deb/*.deb; do
            dpkg-deb --field "$f" Package Version Architecture | tr '\n' ' '; echo
          done

      - name: Dépôt APT, canal dev
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        env:
          FORGEJO_URL: ${{ github.server_url }}
          APT_OWNER: ${{ github.repository_owner }}
          PACKAGES_TOKEN: ${{ secrets.FORGEJO_PACKAGES_TOKEN }}
        run: sh src/packaging/deb/publish-apt.sh dev ci/deb/*.deb

      - name: Statut
        if: always()
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          STATE=success; DESC="tests, programme, paquets $DEB_VERSION"
          [ "${{ job.status }}" = success ] || { STATE=failure; DESC="échec : voir le journal du job go"; }
          curl -s -o /dev/null -X POST -H "Authorization: token $TOKEN" -H "Content-Type: application/json" \
            -d "{\"state\": \"$STATE\", \"context\": \"ci-go\", \"description\": \"$DESC\"}" \
            "${{ github.server_url }}/api/v1/repos/${{ github.repository }}/statuses/${{ github.sha }}"

  # Le reste du dépôt (le panel est testé par le job go, dans l'image) : outils
  # (robot des listes, notes de release), code partagé, vulnérabilités connues des dépendances,
  # syntaxe des scripts shell et de la passerelle Python.
  # The rest of the repository (the panel is tested by the go job, in the image): tools
  # (lists bot, release notes), shared code, known vulnerabilities of dependencies,
  # syntax of the shell scripts and of the Python bridge.
  outils:
    runs-on: docker
    container:
      image: golang:1.26-alpine
    steps:
      - name: Vérifications
        run: |
          set -eu
          apk add --no-cache --quiet git bash python3 curl
          rm -rf src
          git -c "http.extraHeader=Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            clone --quiet "${{ github.server_url }}/${{ github.repository }}.git" src
          git -C src checkout --quiet "${{ github.sha }}"
          cd src
          git config --global user.name ci && git config --global user.email ci@frp-manager.invalid
          test -z "$(gofmt -l .)" || { echo "gofmt :"; gofmt -l .; exit 1; }
          go vet ./...
          go test -count=1 ./internal/... ./tools/...
          go run golang.org/x/vuln/cmd/govulncheck@latest ./...
          bash -n panel/install.sh
          for f in packaging/deb/postinst packaging/deb/prerm packaging/deb/postrm packaging/deb/build-deb.sh packaging/deb/publish-apt.sh; do
            sh -n "$f"
          done
          python3 -m py_compile packaging/python-bridge/app.py

      - name: Statut
        if: always()
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          STATE=success; DESC="gofmt, vet, tests (outils), govulncheck, scripts"
          [ "${{ job.status }}" = success ] || { STATE=failure; DESC="échec : voir le journal du job outils"; }
          curl -s -o /dev/null -X POST -H "Authorization: token $TOKEN" -H "Content-Type: application/json" \
            -d "{\"state\": \"$STATE\", \"context\": \"ci-outils\", \"description\": \"$DESC\"}" \
            "${{ github.server_url }}/api/v1/repos/${{ github.repository }}/statuses/${{ github.sha }}"

  # Installation par apt, comme sur une vraie machine : clé, source, paquet,
  # panel qui répond, puis désinstallation complète.
  apt:
    needs: go
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: docker
    strategy:
      fail-fast: false
      matrix:
        image: ["debian:12", "ubuntu:24.04"]
    container:
      image: ${{ matrix.image }}
    steps:
      - name: apt install frp-manager (canal dev)
        run: |
          set -eu
          export DEBIAN_FRONTEND=noninteractive
          apt-get update -qq
          apt-get install -y -qq curl ca-certificates iproute2 procps >/dev/null
          install -d -m 0755 /etc/apt/keyrings
          curl -fsSL "$APT_REPO/repository.key" -o /etc/apt/keyrings/frp-manager.asc
          echo "deb [signed-by=/etc/apt/keyrings/frp-manager.asc] $APT_REPO dev main" > /etc/apt/sources.list.d/frp-manager.list
          apt-get update -qq
          apt-cache policy frp-manager
          apt-get install -y frp-manager
          frp-manager --version
          test -f /etc/frp/frps.toml && grep bindPort /etc/frp/frps.toml
          test -f /etc/systemd/system/frps.service
          # Pas de systemd dans le conteneur : le panel est lancé à la main
          frp-manager > /tmp/panel.log 2>&1 &
          code=000
          for i in $(seq 1 30); do
            code=$(curl -sk -o /dev/null -w '%{http_code}' https://127.0.0.1:8765/setup || true)
            [ "$code" = 200 ] && break
            sleep 1
          done
          cat /tmp/panel.log
          [ "$code" = 200 ] || { echo "le panel ne répond pas (HTTP $code)"; exit 1; }
          echo "panel : https://127.0.0.1:8765/setup → HTTP 200"
          pkill frp-manager || true
          apt-get purge -y frp-manager
          [ ! -e /usr/bin/frp-manager ] && [ ! -e /etc/frp-manager ] && echo "désinstallation complète"

      - name: Statut
        if: always()
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          STATE=success; DESC="apt install, panel démarré, apt purge"
          [ "${{ job.status }}" = success ] || { STATE=failure; DESC="échec : voir le journal du job apt"; }
          curl -s -o /dev/null -X POST -H "Authorization: token $TOKEN" -H "Content-Type: application/json" \
            -d "{\"state\": \"$STATE\", \"context\": \"ci-apt ${{ matrix.image }}\", \"description\": \"$DESC\"}" \
            "${{ github.server_url }}/api/v1/repos/${{ github.repository }}/statuses/${{ github.sha }}"
